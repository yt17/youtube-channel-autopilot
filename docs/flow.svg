<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1402" viewBox="0 0 860 1402"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs><rect width="860" height="1402" fill="#FFFFFF"/><text x="430" y="44" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2C2C2A" text-anchor="middle">YouTube Channel Autopilot — the daily loop</text><text x="430" y="70" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5F5E5A" text-anchor="middle">Claude skills + a tiny YouTube API CLI + a weekly planning panel</text><rect x="240.0" y="96" width="380" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="430.0" y="120.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Channel Panel</text><text x="430.0" y="139.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">Which channel does what on which weekday</text><line x1="430" y1="152" x2="430" y2="174" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><rect x="240.0" y="176" width="380" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="430.0" y="204.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#712B13" text-anchor="middle">1. You type /channel-ops</text><line x1="430" y1="222" x2="430" y2="244" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><rect x="240.0" y="246" width="380" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="430.0" y="270.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Prep + calendar check</text><text x="430.0" y="289.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">Read YouTube schedule, find free slots</text><path d="M430 302 L430 324" fill="none" stroke="#5F5E5A" stroke-width="1.4"/><path d="M107 324 L752 324" fill="none" stroke="#5F5E5A" stroke-width="1.4"/><line x1="107" y1="324" x2="107" y2="344" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><line x1="322" y1="324" x2="322" y2="344" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><line x1="537" y1="324" x2="537" y2="344" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><line x1="752" y1="324" x2="752" y2="344" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><rect x="12.0" y="346" width="190" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="107.0" y="368.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Comments</text><text x="107.0" y="387.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">Reply drafts</text><text x="107.0" y="406.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">→ approve in panel</text><rect x="227.0" y="346" width="190" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="322.0" y="368.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Research</text><text x="322.0" y="387.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">Trends + competitors</text><text x="322.0" y="406.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">+ comment mining → top ideas</text><rect x="442.0" y="346" width="190" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="537.0" y="368.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Shorts</text><text x="537.0" y="387.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">3 per channel</text><text x="537.0" y="406.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">title · hook · SFX · captions</text><rect x="657.0" y="346" width="190" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="752.0" y="368.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Long video</text><text x="752.0" y="387.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">+ 2 Shorts cut from it</text><text x="752.0" y="406.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">3 thumbnail variants</text><path d="M107 416 L107 436 M322 416 L322 436 M537 416 L537 436 M752 416 L752 436 M107 436 L752 436" fill="none" stroke="#5F5E5A" stroke-width="1.4"/><line x1="430" y1="436" x2="430" y2="458" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><rect x="240.0" y="460" width="380" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="430.0" y="482.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Deliver + reasoned report</text><text x="430.0" y="501.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">videos/ &amp; shorts/ per channel + upload queue</text><text x="430.0" y="520.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">report: sources, why these topics, analysis</text><line x1="430" y1="530" x2="430" y2="552" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><rect x="240.0" y="554" width="380" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="430.0" y="578.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#712B13" text-anchor="middle">2. You drag files into Studio</text><text x="430.0" y="597.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D" text-anchor="middle">One folder per channel, type nothing</text><line x1="430" y1="610" x2="430" y2="632" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><rect x="240.0" y="634" width="380" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="430.0" y="662.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#712B13" text-anchor="middle">3. You type /channel-admin</text><line x1="430" y1="680" x2="430" y2="702" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><rect x="240.0" y="704" width="380" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="430.0" y="726.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Match uploads by file name</text><text x="430.0" y="745.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">Re-check calendar → shift on collision</text><text x="430.0" y="764.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">title · description · tags · thumbnail · schedule</text><line x1="430" y1="774" x2="430" y2="796" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><rect x="240.0" y="798" width="380" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="430.0" y="826.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#712B13" text-anchor="middle">4. /channel-cleanup (every few days)</text><line x1="430" y1="844" x2="430" y2="866" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><rect x="240.0" y="868" width="380" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="430.0" y="892.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">Verify on YouTube → _to_delete</text><text x="430.0" y="911.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">You empty it into the trash</text><rect x="280" y="958" width="16" height="16" rx="3" fill="#FAECE7" stroke="#993C1D"/><text x="304" y="971" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2C2C2A" text-anchor="start">You</text><rect x="370" y="958" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="394" y="971" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2C2C2A" text-anchor="start">Claude</text><rect x="470" y="958" width="16" height="16" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="494" y="971" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2C2C2A" text-anchor="start">Panel</text><text x="50" y="1008" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2C2C2A" text-anchor="start">Skills</text><text x="455" y="1008" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2C2C2A" text-anchor="start">Local folder</text><text x="50" y="1034" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#085041" text-anchor="start">/channel-ops</text><text x="50" y="1051" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start">The day's work: comments, research, production</text><text x="50" y="1074" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#085041" text-anchor="start">/channel-admin</text><text x="50" y="1091" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start">Open panel + finalize &amp; schedule uploads</text><text x="50" y="1114" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#085041" text-anchor="start">/channel-cleanup</text><text x="50" y="1131" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start">Move uploaded files to _to_delete</text><text x="50" y="1154" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#085041" text-anchor="start">channel-research</text><text x="50" y="1171" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start">Called by channel-ops, or on its own</text><text x="50" y="1194" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#085041" text-anchor="start">channel-production</text><text x="50" y="1211" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start">Called by channel-ops, or on its own</text><text x="455" y="1034" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="start">_to_upload/videos|shorts/&lt;Channel&gt;/</text><text x="455" y="1051" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start">Waiting for you to drag into Studio</text><text x="455" y="1074" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="start">_to_upload/UPLOAD-LIST.txt</text><text x="455" y="1091" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start">Which file, which channel, which slot</text><text x="455" y="1114" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="start">reports/</text><text x="455" y="1131" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start">Every run's reasoned report</text><text x="455" y="1154" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="start">research/</text><text x="455" y="1171" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start">Research notes per day and channel</text><text x="455" y="1194" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="start">_to_delete/</text><text x="455" y="1211" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start">Verified uploads, ready for the trash</text><text x="50" y="1244" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2C2C2A" text-anchor="start">Rules</text><text x="50" y="1268" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2C2C2A" text-anchor="start">• Don't rename files — uploads are matched by original file name.</text><text x="50" y="1290" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2C2C2A" text-anchor="start">• Nothing publishes immediately; every video is scheduled into a free slot.</text><text x="50" y="1312" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2C2C2A" text-anchor="start">• Never play audio/video on your machine; checks are silent (ffprobe, frames).</text><text x="50" y="1334" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2C2C2A" text-anchor="start">• Every skill ends with a reasoned report: sources, why chosen, analysis.</text><text x="50" y="1356" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2C2C2A" text-anchor="start">• Official YouTube Data API only — no browser bots.</text></svg>